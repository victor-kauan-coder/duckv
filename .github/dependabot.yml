# Pull requests automaticos quando sai versao nova (ou correcao de seguranca) das dependencias.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # O app Android: plugin do Android, Kotlin, Gradle e bibliotecas dependem uns dos outros (uma
  # biblioteca nova costuma exigir plugin e SDK novos). Por isso vem tudo num PR so, testado junto.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ['*']
