# Testes do duckV em Windows, Linux e macOS, mais verificacoes de seguranca.
# As acoes vao fixadas pelo commit (nao pela tag), que nao pode ser trocado depois;
# o Dependabot atualiza esses commits (.github/dependabot.yml).
name: testes

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1' # toda segunda: pega dependencia que ficou vulneravel sem ninguem mexer

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bateria:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm test

  seguranca:
    name: dependencias e segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # o historico inteiro: segredo apagado num commit antigo continua publico
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: vulnerabilidades conhecidas nas dependencias
        run: npm audit --omit=dev --audit-level=high
      - name: so o node-pty pode rodar script na instalacao
        run: |
          npm ci --no-fund --no-audit
          node -e '
            const lock = require("./package-lock.json");
            const comScript = Object.entries(lock.packages).filter(([k, v]) => k && v.hasInstallScript).map(([k]) => k);
            const estranhos = comScript.filter((k) => !/node-pty/.test(k));
            console.log("com script de instalacao:", comScript.join(", ") || "nenhum");
            if (estranhos.length) { console.error("dependencia nova com script de instalacao:", estranhos); process.exit(1); }'
      - name: segredos no historico (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: analise estatica (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

  android:
    name: app Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: compila o app
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: lint do Android
        working-directory: android
        run: ./gradlew lintDebug --no-daemon
